name: Run Stryker.NET with Dashboard Reporting

on:
  schedule:
    # Change the cron expression to your desired schedule. This example runs every Monday and Thursday at 2 AM.
    - cron: '0 2 * * MON,THU'
      timezone: 'Europe/Berlin'

  workflow_dispatch:
    inputs:
      configurationFile:
        description: 'Path to a single Stryker configuration file (leave empty to run all Roslyn variants)'
        required: false

jobs:
  all:
    if: github.run_id != 1
    name: Run Stryker.NET Mutation Testing (${{ matrix.configurationFile }})
    strategy:
      fail-fast: false
      matrix:
        configurationFile: ${{ fromJson(inputs.configurationFile && format('["{0}"]', inputs.configurationFile) || '["stryker-config.roslyn4_4.json", "stryker-config.roslyn4_14.json", "stryker-config.roslyn5_6.json"]') }}
    uses: dailydevops/pipelines/.github/workflows/mutation-dotnet.yml@c33abb8b428b4c309a9facc01a66e328bc7cd129 # 2.5.158
    with:
      configurationFile: ${{ matrix.configurationFile }}
    secrets: inherit

